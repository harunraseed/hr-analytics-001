name: CI

# Runs on every Pull Request into main. No Databricks needed — fast & deterministic.
on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with dev tools
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Run unit tests
        run: pytest -v
